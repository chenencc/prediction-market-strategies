[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-market-strategies"
version = "0.1.0"
description = "Private Polymarket and Predict.fun strategy research on NautilusTrader"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
exporter = ["pyarrow==26.0.0"]
monitor = ["fastapi==0.121.0", "uvicorn==0.38.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.prediction-market-strategies]
engine-lock = "engine.lock.json"
mode = "research"
live-execution-enabled = false
